<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>985 · 四图生成</title>
<style>
  :root{
    --paper:#F5F0E6;--ink:#241A26;--muted:#7B6E78;--line:rgba(36,26,38,.16);
    --c:#5B0C66;--cd:#2A0631;--accent:#B58A4B;
    --serif:"方正粗黑宋简体","华文中宋","Songti SC","宋体",serif;
    --kai:"华文楷体","KaiTi","楷体",serif;
    --sans:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    --num:Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#111;}
  body{width:1080px;font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  .slide{width:1080px;height:1920px;position:relative;overflow:hidden;background:var(--paper);color:var(--ink);}

  /* ---------- cover ---------- */
  .cover{
    background:
      radial-gradient(900px 700px at 82% 0%,color-mix(in srgb,var(--c) 70%,#ffffff 0%),transparent 62%),
      linear-gradient(155deg,color-mix(in srgb,var(--cd) 80%,#000 20%),var(--cd) 58%,#0B020D 100%);
    color:#FFF7EA;
  }
  .cover::before{
    content:"";position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:70px 70px;
  }
  .cover::after{
    content:attr(data-mark);position:absolute;right:-50px;bottom:-150px;
    font-family:var(--serif);font-size:560px;line-height:1;color:rgba(255,255,255,.035);white-space:nowrap;
  }
  .cover>*{position:relative;z-index:2;}
  .cover-inner{height:100%;padding:64px 72px 0;display:flex;flex-direction:column;}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:17px;letter-spacing:.16em;color:rgba(255,247,234,.55);border-bottom:1px solid rgba(255,255,255,.18);padding-bottom:16px;}
  .topbar .brand{color:var(--accent);font-weight:700;letter-spacing:.2em;}
  .cover-head{display:flex;align-items:center;gap:26px;margin-top:54px;}
  .seal{width:142px;height:142px;border-radius:50%;display:grid;place-items:center;flex:none;border:1px solid rgba(255,255,255,.22);overflow:hidden;}
  .seal img{width:84%;height:84%;object-fit:contain;display:block;}
  .seal.mono{background:var(--c);color:#fff;font-family:var(--serif);font-size:58px;line-height:1;letter-spacing:.02em;text-align:center;}
  .seal.mono small{display:block;font-family:var(--num);font-size:13px;letter-spacing:.1em;margin-top:3px;opacity:.7;}
  .cover-kicker{font-size:23px;letter-spacing:.08em;color:color-mix(in srgb,var(--accent) 80%,white 20%);}
  .cover-right{margin-left:auto;width:156px;height:156px;border:1px dashed rgba(255,255,255,.4);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);color:rgba(255,247,234,.8);flex:none;}
  .cover-right b{font-family:var(--num);font-size:48px;line-height:1;font-weight:400;}
  .cover-right span{font-size:12px;letter-spacing:.16em;margin-top:4px;}
  .cover-name{font-family:var(--serif);font-weight:400;line-height:1.05;letter-spacing:8px;margin:52px 0 0 -4px;color:#FFF9EE;}
  .cover-en{font-family:var(--num);font-size:17px;letter-spacing:.22em;color:rgba(255,247,234,.4);margin-top:14px;}
  .cover-hook{font-family:var(--serif);font-size:44px;line-height:1.6;letter-spacing:.03em;color:#FFF4DC;margin:34px 0 10px;max-width:900px;}
  .cover-sub{font-size:25px;line-height:1.8;color:rgba(255,247,234,.62);margin:0;max-width:860px;}
  .cover-tags{display:flex;flex-wrap:wrap;gap:9px;margin-top:24px;}
  .cover-tags span{font-size:18px;letter-spacing:.08em;color:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.24);padding:7px 14px;}
  .cover-stats{margin-top:auto;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid rgba(255,255,255,.18);border-bottom:1px solid rgba(255,255,255,.1);padding:24px 0;margin-bottom:110px;}
  .cover-stat{padding:0 14px;border-right:1px solid rgba(255,255,255,.12);}
  .cover-stat:last-child{border-right:none;}
  .cover-stat b{display:block;font-family:var(--num);font-size:50px;font-weight:400;line-height:1;color:color-mix(in srgb,var(--accent) 70%,white 30%);}
  .cover-stat b small{font-family:var(--sans);font-size:17px;margin-left:3px;}
  .cover-stat span{display:block;font-size:16px;color:rgba(255,247,234,.7);margin-top:7px;line-height:1.45;}
  .cover-foot{position:absolute;left:72px;right:72px;bottom:44px;display:flex;justify-content:space-between;font-size:16px;letter-spacing:.1em;color:rgba(255,247,234,.42);}
  .cover-foot b{color:var(--accent);font-weight:600;}

  /* ---------- majors ---------- */
  .majors{background:var(--paper);}
  .majors > .topbar{padding:58px 72px 0;}
  .majors .inner{height:100%;padding:22px 72px 42px;display:flex;flex-direction:column;}
  .m-head{display:flex;align-items:flex-end;gap:16px;margin-top:26px;}
  .m-no{font-family:var(--num);font-size:24px;color:var(--accent);padding-bottom:7px;}
  .m-title{font-family:var(--serif);font-size:70px;font-weight:400;line-height:1.1;color:var(--cd);margin:0;letter-spacing:.03em;}
  .m-sub{font-size:23px;line-height:1.7;color:#5A4A5C;margin:14px 0 0 40px;}
  .m-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:26px;}
  .m-grid.standard{grid-template-columns:1fr 1fr;}
  .m-card{min-height:395px;background:#FFFDF8;border:1px solid var(--line);border-top:4px solid var(--c);padding:20px 22px 16px;position:relative;overflow:hidden;}
  .m-card::after{content:attr(data-no);position:absolute;right:8px;bottom:-24px;font-family:var(--num);font-size:104px;line-height:1;color:color-mix(in srgb,var(--c) 6%,white);}
  .m-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
  .m-card .no{font-family:var(--num);font-size:19px;color:var(--accent);}
  .m-tag{font-size:14px;color:var(--c);background:color-mix(in srgb,var(--c) 8%,white);padding:4px 8px;border-radius:2px;}
  .m-card h3{font-family:var(--serif);font-size:35px;font-weight:400;line-height:1.2;margin:0 0 3px;color:var(--cd);}
  .m-card .sub{font-size:17px;color:var(--c);font-weight:700;letter-spacing:.06em;margin-bottom:12px;}
  .m-line{font-size:20px;line-height:1.55;color:#4A3B4D;margin:0 0 6px;}
  .m-line b{font-size:15px;color:var(--accent);letter-spacing:.08em;margin-right:5px;}
  .m-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}
  .m-tags span{font-size:14px;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 20%,white);padding:3px 7px;border-radius:20px;}
  .m-note{margin-top:18px;background:color-mix(in srgb,var(--c) 7%,white);border-left:5px solid var(--c);padding:16px 22px;font-size:19px;line-height:1.7;color:#4A3B4D;}
  .m-note b{color:var(--c);}
  .m-strip{margin-top:16px;background:var(--cd);color:#FFF7EA;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;gap:20px;}
  .m-strip p{margin:0;font-size:19px;line-height:1.7;color:rgba(255,247,234,.82);}
  .m-strip b{color:var(--accent);}
  .m-strip .go{font-size:19px;color:var(--accent);white-space:nowrap;}
  .m-foot{margin-top:14px;font-size:15px;line-height:1.6;color:var(--muted);border-top:1px solid rgba(36,26,38,.1);padding-top:12px;display:flex;justify-content:space-between;gap:12px;}
  .m-foot b{color:var(--c);}

  /* ---------- outcomes ---------- */
  .out-top{height:1080px;background:linear-gradient(155deg,var(--c),var(--cd) 62%,#0B020D);color:#FFF7EA;position:relative;overflow:hidden;}
  .out-top::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:64px 64px;}
  .out-top::after{content:attr(data-mark);position:absolute;right:-40px;bottom:-130px;font-family:var(--serif);font-size:460px;line-height:1;color:rgba(255,255,255,.035);white-space:nowrap;pointer-events:none;}
  .out-top .inner{position:relative;z-index:2;height:100%;padding:58px 72px 0;}
  .out-head{display:flex;align-items:flex-end;gap:16px;margin-top:26px;}
  .out-no{font-family:var(--num);font-size:24px;color:var(--accent);padding-bottom:7px;}
  .out-title{font-family:var(--serif);font-size:70px;font-weight:400;color:#FFF9EE;margin:0;letter-spacing:.03em;}
  .out-big{display:flex;align-items:flex-end;gap:18px;margin-top:30px;}
  .out-big .n{font-family:var(--num);font-size:172px;line-height:.85;color:color-mix(in srgb,var(--accent) 70%,white 30%);letter-spacing:-.02em;}
  .out-big .n small{font-size:56px;}
  .out-big .t{font-size:22px;line-height:1.6;color:rgba(255,247,234,.72);padding-bottom:14px;}
  .out-big .t b{display:block;color:#FFF7EA;font-size:25px;margin-bottom:4px;}
  .out-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:30px;}
  .out-mini div{border-top:1px solid rgba(255,255,255,.2);padding-top:14px;}
  .out-mini b{display:block;font-family:var(--num);font-size:40px;font-weight:400;color:#FFF3D8;line-height:1.1;}
  .out-mini span{display:block;font-size:17px;line-height:1.6;color:rgba(255,247,234,.55);margin-top:3px;}
  .out-comlabel{font-size:15px;letter-spacing:.18em;color:color-mix(in srgb,var(--accent) 70%,white 30%);margin-top:26px;font-weight:700;}
  .out-companies{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .out-companies span{font-size:18px;color:rgba(255,247,234,.86);border:1px solid rgba(255,255,255,.2);padding:6px 10px;}
  .out-quote{margin-top:24px;padding-top:18px;border-top:1px solid rgba(255,255,255,.16);font-family:var(--kai,"华文楷体",serif);font-size:27px;line-height:1.65;color:rgba(255,247,234,.78);}
  .out-takeaway{margin-top:20px;font-size:21px;line-height:1.8;color:rgba(255,247,234,.55);border-left:3px solid color-mix(in srgb,var(--accent) 60%,white 40%);padding-left:14px;}
  .out-bottom{height:840px;background:var(--paper);padding:40px 72px 0;position:relative;overflow:hidden;}
  .out-bottom::after{content:attr(data-series);position:absolute;right:18px;bottom:-70px;font-family:var(--num);font-size:250px;line-height:1;color:rgba(36,26,38,.035);pointer-events:none;}
  .out-bottom > *{position:relative;z-index:1;}
  .out-bhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;}
  .out-bhead h2{font-family:var(--serif);font-size:52px;font-weight:400;color:var(--cd);margin:0;letter-spacing:.03em;}
  .out-bhead span{font-size:16px;color:var(--muted);padding-bottom:6px;}
  .score-table{width:100%;border-collapse:collapse;margin-top:22px;}
  .score-table th{text-align:left;font-size:15px;letter-spacing:.08em;color:var(--accent);font-weight:700;padding:0 0 8px;border-bottom:1px solid var(--line);}
  .score-table td{font-size:20px;color:#4A3B4D;padding:15px 0;border-bottom:1px dashed rgba(36,26,38,.12);}
  .score-table td.n{font-family:var(--num);font-size:28px;color:var(--c);}
  .out-note{font-size:16px;line-height:1.7;color:var(--muted);margin:12px 0 0;}
  .out-tips{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:20px;}
  .out-tips div{background:#FFFDF8;border:1px solid var(--line);padding:12px 14px;font-size:15px;line-height:1.55;color:#4A3B4D;}
  .out-tips b{display:block;font-size:15px;color:var(--c);margin-bottom:3px;}
  .out-profile{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;margin-top:18px;}
  .out-profile div{border-right:1px solid rgba(36,26,38,.1);padding:0 12px;}
  .out-profile div:last-child{border-right:none;}
  .out-profile b{display:block;font-family:var(--num);font-size:26px;color:var(--c);font-weight:400;line-height:1.1;}
  .out-profile span{display:block;font-size:14px;color:var(--muted);margin-top:3px;}
  .out-standline{font-size:18px;line-height:1.7;color:#4A3B4D;margin:14px 0 0;}
  .out-majorlabel{font-size:15px;letter-spacing:.18em;color:var(--c);font-weight:700;margin-top:16px;}
  .out-majorchips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}
  .out-majorchips span{font-size:16px;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 20%,white);background:#FFFDF8;padding:5px 9px;border-radius:999px;}
  .out-clusters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
  .out-clusters div{background:#FFFDF8;border:1px solid var(--line);padding:10px 12px;font-size:14px;line-height:1.5;color:#4A3B4D;}
  .out-clusters b{display:block;color:var(--c);font-size:15px;margin-bottom:2px;}
  .out-foot{display:flex;justify-content:space-between;font-size:18px;color:var(--c);font-weight:700;margin-top:18px;}

  /* ---------- campus ---------- */
  .camp-top{height:1210px;background:var(--paper);padding:56px 72px 0;}
  .camp-head{display:flex;align-items:flex-end;gap:16px;margin-top:22px;}
  .camp-no{font-family:var(--num);font-size:24px;color:var(--accent);padding-bottom:6px;}
  .camp-title{font-family:var(--serif);font-size:64px;font-weight:400;color:var(--cd);margin:0;letter-spacing:.03em;}
  .landmark{margin-top:22px;border:1px solid var(--line);background:radial-gradient(600px 300px at 80% 10%,color-mix(in srgb,var(--accent) 16%,white),transparent 70%),#FFFDF8;padding:6px 6px 0;color:var(--c);}
  .landmark svg{display:block;width:100%;height:auto;}
  .camp-facts{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:20px;}
  .camp-facts div{padding:14px 10px;border-right:1px solid rgba(36,26,38,.1);}
  .camp-facts div:last-child{border-right:none;}
  .camp-facts b{display:block;font-family:var(--num);font-size:31px;font-weight:400;color:var(--c);line-height:1.1;}
  .camp-facts span{display:block;font-size:15px;color:var(--muted);margin-top:3px;}
  .camp-guide-title{font-family:var(--serif);font-size:31px;color:var(--cd);margin:20px 0 10px;letter-spacing:.04em;}
  .camp-guide{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
  .camp-guide div{background:#FFFDF8;border:1px solid var(--line);padding:13px 15px;font-size:17px;line-height:1.55;color:#4A3B4D;}
  .camp-guide b{display:block;font-family:var(--num);font-size:20px;color:var(--accent);margin-bottom:3px;}
  .camp-alumni{font-size:17px;line-height:1.7;color:var(--muted);margin-top:16px;}
  .camp-alumni b{color:var(--c);}
  .camp-keywords{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;}
  .camp-keywords span{font-size:15px;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 20%,white);background:#FFFDF8;padding:4px 9px;border-radius:999px;}
  .camp-bottom{height:710px;background:linear-gradient(155deg,var(--c),var(--cd) 62%,#0B020D);color:#FFF7EA;padding:50px 72px 0;position:relative;overflow:hidden;}
  .camp-bottom::before{content:"“";position:absolute;left:30px;top:-40px;font-family:var(--num);font-size:250px;color:rgba(255,255,255,.08);line-height:1;}
  .camp-bottom::after{content:attr(data-year);position:absolute;right:20px;bottom:-40px;font-family:var(--num);font-size:230px;color:rgba(255,255,255,.035);line-height:1;}
  .camp-bottom>*{position:relative;z-index:1;}
  .camp-quote{font-family:var(--kai,"华文楷体",serif);font-size:37px;line-height:1.7;letter-spacing:.03em;color:#FFF7EA;margin:0 0 10px;}
  .camp-by{font-size:16px;letter-spacing:.1em;color:rgba(255,247,234,.55);}
  .camp-by b{color:var(--accent);}
  .camp-line{height:1px;background:rgba(255,255,255,.16);margin:24px 0 22px;}
  .camp-fin{font-family:var(--serif);font-size:86px;letter-spacing:7px;color:#FFF9EE;margin:0 0 8px;line-height:1.15;}
  .camp-motto{font-family:var(--kai,"华文楷体",serif);font-size:24px;letter-spacing:.26em;color:rgba(255,247,234,.65);}
  .camp-cta{display:flex;justify-content:space-between;align-items:flex-end;margin-top:26px;}
  .camp-cta p{margin:0;font-size:18px;line-height:1.8;color:rgba(255,247,234,.55);}
  .camp-cta p b{color:var(--accent);}
  .camp-cta .next{font-size:18px;color:var(--accent);text-align:right;letter-spacing:.06em;}
</style>
</head>
<body>
<div id="deck"></div>

<script src="../data/schools.js?v=5"></script>
<script src="../data/schools_extra.js?v=5"></script>
<script src="../data/dut_rich.js"></script>
<script src="../data/schools_211.js?v=5"></script>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var id = params.get('id') || window.SCHOOL_ORDER[0];
  var s = window.SCHOOLS[id];
  var series = s.series || '985';
  if(!s){ document.body.innerHTML = '<h1 style="color:#fff;padding:40px">School not found</h1>'; return; }
  document.documentElement.style.setProperty('--c', s.color);
  document.documentElement.style.setProperty('--cd', s.dark);
  document.documentElement.style.setProperty('--accent', s.accent);
  document.documentElement.style.setProperty('--paper', s.paper);

  function emblem(){
    var e = s.emblem || {};
    if(e.type === 'img'){
      var bg = e.bg === 'dark' ? 'rgba(255,255,255,.08)' : '#FFF8EC';
      return '<div class="seal" style="background:'+bg+'"><img src="../'+e.src+'" alt=""></div>';
    }
    return '<div class="seal mono" style="background:#FFF8EC;color:'+s.color+';border:2px solid '+s.color+'">'+e.text+'<small>'+e.sub+'</small></div>';
  }

  function cover(){
    var L = s.name.length;
    var nameSize = L >= 8 ? '92px' : (L >= 6 ? '108px' : '150px');
    var stats = s.stats.map(function(st){
      return '<div class="cover-stat"><b>'+st.n+'<small>'+st.u+'</small></b><span>'+st.l+'<br>'+st.s+'</span></div>';
    }).join('');
    var tags = s.tags.map(function(t){return '<span>'+t+'</span>';}).join('');
    return '<section class="slide cover" data-mark="'+(s.place||s.short)+'">'
      +'<div class="cover-inner">'
      +'<div class="topbar"><span class="brand">我的大学 · '+series+' 系列</span><span>'+s.city+'</span><span>01 / 04</span></div>'
      +'<div class="cover-head">'+emblem()
      +'<div class="cover-kicker">'+s.type+' · '+s.city+'</div>'
      +'<div class="cover-right"><b>'+series+'</b><span>'+(series==='211'?'工程 · 2026':'首批 · 2026')+'</span></div></div>'
      +'<div class="cover-name" style="font-size:'+nameSize+'">'+s.name+'</div>'
      +'<div class="cover-en">'+s.en+'</div>'
      +'<div class="cover-hook">'+s.hook+'</div>'
      +'<div class="cover-sub">'+s.sub+'</div>'
      +'<div class="cover-tags">'+tags+'</div>'
      +'<div class="cover-stats">'+stats+'</div>'
      +'<div class="cover-foot"><span><b>2026</b> 数据参考 · 以官方为准</span><span>左滑看专业 →</span></div>'
      +'</div></section>';
  }

  function majors(){
    var isStd = !!s.standard;
    var cards = s.majors.map(function(m,i){
      var tags = m.tags.map(function(t){return '<span>'+t+'</span>';}).join('');
      return '<div class="m-card" data-no="0'+(i+1)+'">'
        +'<div class="m-top"><span class="no">0'+(i+1)+'</span><span class="m-tag">'+m.tags[0]+'</span></div>'
        +'<h3>'+m.name+'</h3><div class="sub">'+m.sub+'</div>'
        +'<p class="m-line"><b>学</b>'+m.learn+'</p>'
        +'<p class="m-line"><b>去</b>'+m.go+'</p>'
        +'<p class="m-line"><b>特</b>'+m.feature+'</p>'
        +'<div class="m-tags">'+tags+'</div></div>';
    }).join('');
    var sub = s.name + ' 的 6 个代表专业：学什么、有什么特色、毕业去哪儿。';
    var strip = isStd
      ? '这里列的是 '+s.name+' 的 6 个代表专业。<br>更多方向在本科招生网。'
      : (s.rich ? '这里列的是 6 个代表专业。<br>'+s.name+'有 7 个 A 类学科。' : '没展开的方向还有很多。<br>'+s.name+'共有 <b>'+s.stats[0].n+' 个 A+ 学科</b>。');
    return '<section class="slide majors">'

    return '<section class="slide">'
      +'<div class="camp-top">'
      +'<div class="topbar" style="color:#7B6E78;border-color:rgba(36,26,38,.12)"><span class="brand" style="color:'+s.accent+'">我的大学 · '+series+' 系列</span><span>'+s.name+' / 2026</span><span>04 / 04</span></div>'
      +'<div class="camp-head"><div class="camp-no">04</div><h2 class="camp-title">在'+(s.place||s.short)+'生活</h2></div>'
      +'<div class="landmark">'+(s.landmark === 'standard' ? standardGate(s.short) : (landmarks[s.landmark]||''))+'</div>'
      +'<div class="camp-facts">'+facts+'</div>'
      +'<div class="camp-guide-title">校园生存指南</div>'
      +'<div class="camp-guide">'+guide+'</div>'
      +'<div class="camp-keywords">'+(s.campus.keywords||[]).map(function(k){return '<span>'+k+'</span>';}).join('')+'</div>'
      +'<div class="camp-alumni">'+s.campus.alumni+'</div>'
      +'</div>'
      +'<div class="camp-bottom" data-year="'+s.campus.facts[0].n+'">'
      +'<div class="camp-quote">'+s.campus.quote+'</div>'
      +'<div class="camp-by"><b>'+s.campus.quoteBy+'</b></div>'
      +'<div class="camp-line"></div>'
      +'<div class="camp-fin">下一站，'+(s.nick||s.short)+'。</div>'
      +'<div class="camp-motto">自 '+s.campus.facts[0].n+' 年以来</div>'
      
      +'</div></section>';
  }

  var slides = [cover(), majors(), outcomes(), campus()];
  var only = parseInt(params.get('only') || '0', 10);
  document.getElementById('deck').innerHTML = only ? (slides[only - 1] || slides[0]) : slides.join('');
})();
</script>
</body>
</html>
