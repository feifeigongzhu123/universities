<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>985 图鉴 · 我的大学</title>
<style>
  :root{--paper:#F5F0E6;--ink:#241A26;--soft:#5A4A5C;--muted:#8B7C86;--purple:#5B0C66;--deep:#2A0631;--gold:#B58A4B;--line:rgba(91,12,102,.14);--serif:"方正粗黑宋简体","华文中宋","Songti SC","宋体",serif;--sans:"微软雅黑","Noto Sans SC",sans-serif;--num:Georgia,serif}
  *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}a{color:inherit;text-decoration:none}.wrap{max-width:1180px;margin:0 auto;padding:0 28px 60px}
  .hero{margin:0 -28px 26px;padding:42px 48px 38px;border-radius:0 0 28px 28px;background:radial-gradient(700px 420px at 88% 0%,rgba(142,58,152,.48),transparent 65%),linear-gradient(150deg,#3B0846,#2A0631 58%,#1C0421);color:#FFF7EA;position:relative;overflow:hidden}.hero:after{content:"985";position:absolute;right:-20px;bottom:-80px;font-family:var(--num);font-size:300px;color:rgba(255,255,255,.035)}
  .hero .top{display:flex;justify-content:space-between;gap:16px;font-size:12px;letter-spacing:.16em;color:rgba(244,238,227,.55);border-bottom:1px solid rgba(255,255,255,.16);padding-bottom:14px}.hero .top b{color:var(--gold);letter-spacing:.2em}
  .hero h1{font-family:var(--serif);font-size:58px;font-weight:400;letter-spacing:8px;margin:28px 0 8px;color:#FFF9EE}.hero .lead{margin:0;font-size:16px;color:rgba(244,238,227,.7)}.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.links a{font-size:12px;color:#E3C08A;border:1px solid rgba(217,185,127,.4);padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.04)}
  .stats{display:flex;gap:34px;margin-top:28px;flex-wrap:wrap}.stats b{display:block;font-family:var(--num);font-size:30px;color:#E3C08A;font-weight:400}.stats span{font-size:11px;color:rgba(244,238,227,.55)}
  .toolbar{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:26px 0 14px}.toolbar h2{font-family:var(--serif);font-size:28px;font-weight:400;margin:0;color:var(--deep)}.toolbar .hint{font-size:12px;color:var(--muted)}.tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}.search{flex:1;min-width:220px;background:#FFFDF8;border:1px solid var(--line);padding:12px 16px;font-size:14px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters button{font-size:12px;color:var(--soft);background:transparent;border:1px solid var(--line);padding:8px 12px;cursor:pointer}.filters button.on{background:var(--purple);border-color:var(--purple);color:#fff}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#FFFDF8;border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;transition:.2s;min-height:250px}.card:hover{transform:translateY(-3px);box-shadow:0 14px 36px rgba(42,6,49,.09);border-color:rgba(91,12,102,.35)}.card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.seal{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;font-family:var(--serif);font-size:20px}.tag{font-size:10px;color:var(--purple);background:#EEE1F0;padding:4px 8px}.card h3{font-family:var(--serif);font-size:24px;font-weight:400;margin:0 0 3px;color:var(--deep)}.en{font-family:var(--num);font-size:9px;letter-spacing:.1em;color:var(--muted);min-height:18px}.city{font-size:12px;color:var(--purple);margin:7px 0 5px}.hook{font-size:12.5px;line-height:1.7;color:var(--soft);margin:0 0 14px}.mini{display:flex;gap:14px;border-top:1px solid var(--line);padding-top:10px;margin-top:auto}.mini b{display:block;font-family:var(--num);font-size:18px;color:var(--deep)}.mini span{font-size:10px;color:var(--muted)}
  .foot{margin-top:34px;border-top:1px solid var(--line);padding-top:16px;font-size:11px;line-height:1.9;color:var(--muted)}@media(max-width:900px){.wrap{padding:0 16px 40px}.hero{margin:0 -16px 20px;padding:32px 22px 28px}.hero h1{font-size:40px;letter-spacing:4px}.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
  <section class="hero"><div class="top"><span><b>我的大学</b> · 985 系列</span><span>DATA AS OF 2026.11</span></div><h1>我的大学</h1><p class="lead">选一所大学，听它讲完自己的故事。</p><div class="links"><a href="index.html">← 首页</a><a href="majors.html">专业目录 · 45 个 →</a><a href="index211.html">211 图鉴 · 76 所 →</a></div><div class="stats"><div><b>39</b><span>所 985 高校</span></div><div><b>234</b><span>个代表专业</span></div><div><b>21</b><span>座城市</span></div><div><b>7</b><span>大地区</span></div></div></section>
  <div class="toolbar"><h2>选择一所学校</h2><span class="hint">共 <b id="count">39</b> 所 · 点击卡片播放</span></div>
  <div class="tools"><input class="search" id="search" type="search" placeholder="搜学校或城市，例如：武汉、电子科大"><div class="filters" id="filters"><button class="on" data-f="all">全部</button><button data-f="华北">华北</button><button data-f="华东">华东</button><button data-f="华中">华中</button><button data-f="华南">华南</button><button data-f="西南">西南</button><button data-f="西北">西北</button><button data-f="东北">东北</button></div></div>
  <div class="grid" id="grid"></div>
  <div class="foot"><b>数据口径：</b>39 所均不含分省录取分数。标准版含 2026 届保研率、A+ / 强势专业、6 个代表专业和就业方向。保研率为第三方统计口径。所有数据以学校本科招生网及各省考试院最新公布为准。<br>本页为个人整理的非官方页面。无二维码，纯静态网页。</div>
</div>
<script src="data/schools.js"></script><script src="data/schools_extra.js"></script><script src="data/dut_rich.js"></script>
<script>
(function(){
  var grid=document.getElementById('grid'),count=document.getElementById('count'),bar=document.getElementById('filters'),search=document.getElementById('search'),active='all';
  var ids=window.SCHOOL_ORDER||[];
  function seal(s){var e=s.emblem||{};return '<div class="seal" style="--c:'+s.color+'">'+(e.text||s.short)+'</div>'}
  function card(s){var tags=s.tags.map(function(t){return '<span class="tag">'+t+'</span>'}).join('');return '<a class="card" href="school.html?id='+encodeURIComponent(s.id)+'" style="--c:'+s.color+'"><div class="top">'+seal(s)+'<div>'+tags+'</div></div><h3>'+s.name+'</h3><div class="en">'+s.en+'</div><div class="city">'+s.city+'</div><p class="hook">'+s.hook+'</p><div class="mini"><div><b>'+s.stats[0].n+s.stats[0].u+'</b><span>'+s.stats[0].l+'</span></div><div><b>'+s.stats[1].n+s.stats[1].u+'</b><span>'+s.stats[1].l+'</span></div><div><b>'+s.stats[2].n+s.stats[2].u+'</b><span>'+s.stats[2].l+'</span></div></div></a>'}
  function render(){var q=search.value.trim().toLowerCase();var list=ids.map(function(id){return window.SCHOOLS[id]}).filter(function(s){if(!s)return false;var ok=active==='all'||s.region===active;var text=(s.name+' '+s.city+' '+s.hook+' '+s.en).toLowerCase();return ok&&(!q||text.indexOf(q)>=0)});grid.innerHTML=list.map(card).join('');count.textContent=list.length}
  bar.onclick=function(e){var b=e.target.closest('button');if(!b)return;active=b.getAttribute('data-f');bar.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b)});render()};search.oninput=render;render();
})();
</script></body></html>
