<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的大学 · 学校介绍</title>
<style>
  :root{--c:#5B0C66;--cd:#2A0631;--accent:#C9A063;--paper:#F5F0E6;--ink:#241A26;--soft:#5A4A5C;
    --serif:"方正粗黑宋简体","华文中宋","Songti SC","宋体",serif;--sans:"微软雅黑","Noto Sans SC",sans-serif;--num:Georgia,serif;}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{background:radial-gradient(900px 700px at 50% -10%,color-mix(in srgb,var(--c) 38%,#120216),transparent 65%),linear-gradient(160deg,#160318,#0D0110);color:#FFF7EA;font-family:var(--sans);overflow:hidden}
  a{color:inherit;text-decoration:none}.app{min-height:100%;display:flex;align-items:center;justify-content:center;gap:44px;padding:24px 22px}
  .phone{position:relative;width:min(430px,calc((100vh - 48px)*.5625));aspect-ratio:9/16;border-radius:34px;overflow:hidden;background:#0B020D;border:1px solid rgba(255,255,255,.16);box-shadow:0 40px 120px rgba(0,0,0,.55),0 0 0 8px rgba(255,255,255,.035);flex:none}
  #slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:opacity .25s;background:var(--cd)}
  .back{position:absolute;top:10px;left:12px;z-index:5;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;font-size:16px}
  .controls{position:absolute;left:16px;right:16px;bottom:22px;z-index:5;display:flex;justify-content:space-between;align-items:center}
  .group{display:flex;gap:8px;align-items:center}
  .ctrl{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#FFF7EA;font-size:14px;display:grid;place-items:center;cursor:pointer}
  .ctrl.main{width:48px;height:48px;background:#FFF3D8;color:#241A26;border:0;font-size:16px}
  .side{max-width:340px}.kicker{font-size:11px;letter-spacing:.18em;color:var(--accent)}.side h1{font-family:var(--serif);font-size:42px;font-weight:400;line-height:1.15;margin:8px 0 4px;color:#FFF9EE}
  .en{font-family:var(--num);font-size:11px;letter-spacing:.16em;color:rgba(244,238,227,.42)}
  .city{font-size:13px;color:rgba(244,238,227,.6);margin-top:10px}.hook{font-size:15px;line-height:1.8;color:rgba(244,238,227,.8)}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}.tags span{font-size:11px;border:1px solid rgba(255,255,255,.2);padding:4px 8px;color:rgba(255,255,255,.75)}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0;padding-top:16px;border-top:1px solid rgba(255,255,255,.14)}
  .stats b{display:block;font-family:var(--num);font-size:28px;font-weight:400;color:var(--accent)}.stats span{font-size:11px;color:rgba(244,238,227,.5)}
  .backlink{display:inline-block;font-size:11px;color:rgba(244,238,227,.55);border-bottom:1px solid rgba(255,255,255,.2);padding-bottom:3px}
  @media(max-width:900px){body{overflow:auto}.app{padding:0;display:block}.phone{width:100vw;height:100vh;height:100dvh;aspect-ratio:auto;border-radius:0;border:0;box-shadow:none}#slide{object-fit:contain}.side{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="phone">
    <img id="slide" alt="">
    <a class="back" id="backFab" href="index.html">←</a>
    <div class="controls">
      <div class="group"><button class="ctrl" id="prev">←</button><button class="ctrl main" id="play">▶</button><button class="ctrl" id="next">→</button></div>
      <button class="ctrl" id="mute">🔊</button>
    </div>
  </div>
  <aside class="side">
    <div class="kicker" id="kicker">我的大学</div>
    <h1 id="name">学校</h1><div class="en" id="en"></div><div class="city" id="city"></div>
    <p class="hook" id="hook"></p><div class="tags" id="tags"></div><div class="stats" id="stats"></div>
    <a class="backlink" id="back" href="index.html">← 返回图鉴</a>
  </aside>
</div>
<script src="data/schools.js"></script>
<script src="data/schools_extra.js"></script>
<script src="data/dut_rich.js"></script>
<script src="data/schools_211.js"></script>
<script>
(function(){
  var p=new URLSearchParams(location.search), id=p.get('id')||window.SCHOOL_ORDER[0];
  var s=window.SCHOOLS[id]||window.SCHOOLS[window.SCHOOL_ORDER[0]];
  if(!s){document.body.innerHTML='<p style="padding:40px;color:#fff">没有找到这所学校。</p>';return;}
  var series=s.series||'985', total=4, index=0, started=false, muted=false;
  document.title=s.name+' · 我的大学';
  document.documentElement.style.setProperty('--c',s.color);document.documentElement.style.setProperty('--cd',s.dark);document.documentElement.style.setProperty('--accent',s.accent);
  document.getElementById('kicker').textContent='我的大学 · '+series+' 系列';
  var nm=document.getElementById('name');nm.textContent=s.name;if(s.name.length>=8)nm.style.fontSize='34px';
  document.getElementById('en').textContent=s.en;document.getElementById('city').textContent=s.city;
  document.getElementById('hook').textContent=s.hook;
  document.getElementById('tags').innerHTML=s.tags.map(function(t){return '<span>'+t+'</span>'}).join('');
  document.getElementById('stats').innerHTML=s.stats.map(function(x){return '<div><b>'+x.n+x.u+'</b><span>'+x.l+'</span></div>'}).join('');
  var backHref=series==='211'?'index211.html':'index985.html';
  var b1=document.getElementById('back'),b2=document.getElementById('backFab');b1.href=backHref;b2.href=backHref;b1.textContent='← 返回 '+series+' 图鉴';
  var img=document.getElementById('slide'), play=document.getElementById('play'), mute=document.getElementById('mute');
  var voice=new Audio();voice.preload='auto';var bgm=new Audio('assets/music/bgm.wav');bgm.loop=true;bgm.volume=.08;
  function imgPath(i){return 'assets/covers/'+s.id+'/0'+i+'.webp'}function audioPath(i){return 'audio/'+s.id+'/0'+i+'.mp3'}
  function show(i,go){index=(i+total)%total;img.style.opacity=0;var pre=new Image();pre.onload=pre.onerror=function(){img.src=imgPath(index+1);img.style.opacity=1};pre.src=imgPath(index+1);if(started){voice.pause();voice.src=audioPath(index+1);voice.load();if(go!==false)voice.play().catch(function(){play.textContent='▶'})}}
  function start(){started=true;bgm.play().catch(function(){});voice.src=audioPath(index+1);voice.play().catch(function(){play.textContent='▶'})}
  function toggle(){if(voice.paused){voice.play().catch(function(){});bgm.play().catch(function(){});play.textContent='❚❚'}else{voice.pause();bgm.pause();play.textContent='▶'}}
  voice.onended=function(){if(index<total-1)setTimeout(function(){if(voice.paused)show(index+1,true)},700);else{bgm.pause();play.textContent='▶'}};
  voice.onplay=function(){play.textContent='❚❚'};voice.onpause=function(){if(!voice.ended)play.textContent='▶'};
  play.onclick=toggle;document.getElementById('prev').onclick=function(){show(index-1,true)};document.getElementById('next').onclick=function(){show(index+1,true)};
  mute.onclick=function(){muted=!muted;voice.muted=bgm.muted=muted;mute.textContent=muted?'🔇':'🔊'};
  document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft')show(index-1,true);if(e.key==='ArrowRight')show(index+1,true);if(e.key===' '){e.preventDefault();toggle()}});
  var tx=0;img.addEventListener('touchstart',function(e){tx=e.touches[0].clientX},{passive:true});img.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>44)show(index+(dx<0?1:-1),true)},{passive:true});
  show(0,false);start();window.__playerState=function(){return{index:index,paused:voice.paused,src:voice.src}};
})();
</script>
</body>
</html>
